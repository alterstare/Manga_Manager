name: Release

# Push a version tag (e.g. v0.3.0) to build on both OSes and publish a GitHub
# Release with the installers + update metadata. Windows nsis (.exe) and Linux
# AppImage are auto-updatable; zip/tar.gz are portable-only.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # electron-builder needs write access to create the release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Build & publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
