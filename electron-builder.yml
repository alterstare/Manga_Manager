appId: com.noth2.mangamanager
productName: MangaManager
publish:
  provider: github
  owner: alterstare
  repo: Manga_viewer
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No spaces: on-disk name == latest.yml url == uploaded asset name, so the
  # updater can find the installer (GitHub/electron-updater don't reconcile spaces).
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  target:
    - AppImage
    - tar.gz
  category: Graphics
